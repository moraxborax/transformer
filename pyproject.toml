[project]
name = "transformer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "moraxborax", email = "humphrey57shen@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "numpy>=2.5.4",
    "tensorboard>=2.21.0",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]
